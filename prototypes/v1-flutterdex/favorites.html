<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Favorites — Pokedex (V1 FlutterDex)</title>

  <link rel="stylesheet" href="../styles/tokens-v1-flutterdex.css" />
  <link rel="stylesheet" href="../styles/reset.css" />
  <link rel="stylesheet" href="../styles/shell.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* V1 — Favorites view. List of favorited Pokémon (subset of catalog). */

    body { padding-bottom: 80px; }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--space-3) var(--space-4); background-color: var(--color-bg-secondary);
      border-bottom: 1px solid var(--color-border-primary); position: sticky; top: 0; z-index: 10;
    }
    .topbar__title { font-size: var(--font-size-lg); font-weight: var(--font-weight-bold); letter-spacing: var(--letter-spacing-tight); }
    .topbar__count {
      padding: 2px 10px;
      background-color: var(--color-bg-tertiary);
      border-radius: var(--border-radius-full);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-secondary);
    }

    .grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3);
      padding: var(--space-4);
    }

    .pokemon-card {
      display: block;
      background-color: var(--color-bg-secondary); border: 1px solid var(--color-border-primary);
      border-radius: var(--border-radius-lg); padding: var(--space-3);
      box-shadow: var(--shadow-sm); position: relative;
      color: var(--color-text-primary);
      text-decoration: none;
      transition: box-shadow var(--duration-fast) var(--easing-default), transform var(--duration-fast) var(--easing-default);
    }
    .pokemon-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); text-decoration: none; }
    .pokemon-card:focus-visible { box-shadow: var(--shadow-focus); outline: none; }
    .pokemon-card__fav {
      position: absolute; top: 8px; right: 8px; width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      color: #C58E3A; cursor: pointer; border-radius: var(--border-radius-full);
    }
    .pokemon-card__fav:hover { background-color: var(--color-bg-tertiary); }
    .pokemon-card__fav svg { width: 20px; height: 20px; }
    .pokemon-card__sprite {
      width: 100%; aspect-ratio: 1; background-color: var(--color-bg-tertiary);
      border-radius: var(--border-radius-md); margin-bottom: var(--space-2);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .pokemon-card__sprite img { width: 80%; height: 80%; object-fit: contain; image-rendering: pixelated; }
    .pokemon-card__id { font-size: var(--font-size-xs); color: var(--color-text-tertiary); letter-spacing: var(--letter-spacing-wide); text-transform: uppercase; font-weight: var(--font-weight-medium); }
    .pokemon-card__name { font-size: var(--font-size-md); font-weight: var(--font-weight-bold); margin: 2px 0 var(--space-2); }
    .pokemon-card__types { display: flex; gap: 4px; flex-wrap: wrap; }
    .type-badge {
      display: inline-flex; align-items: center; padding: 2px 8px;
      border-radius: var(--border-radius-full);
      font-size: 10px; font-weight: var(--font-weight-semibold);
      letter-spacing: var(--letter-spacing-wide); text-transform: uppercase;
    }
    .type-badge--normal   { background: var(--type-badge-bg-normal);   color: var(--type-badge-text-normal); }
    .type-badge--electric { background: var(--type-badge-bg-electric); color: var(--type-badge-text-electric); }

    .empty-state {
      display: flex; flex-direction: column; align-items: center; gap: var(--space-3);
      padding: var(--space-7) var(--space-4); text-align: center;
      background-color: var(--color-bg-secondary);
      border: 1px dashed var(--color-border-primary);
      border-radius: var(--border-radius-lg);
      margin: var(--space-5) var(--space-4);
    }
    .empty-state svg { width: 48px; height: 48px; color: var(--color-text-tertiary); }
    .empty-state h3 { font-size: var(--font-size-md); font-weight: var(--font-weight-semibold); }
    .empty-state p { font-size: var(--font-size-sm); color: var(--color-text-secondary); max-width: 32ch; }

    @media (min-width: 768px) {
      .grid { grid-template-columns: repeat(4, 1fr); max-width: 1100px; margin: 0 auto; padding: var(--space-6); }
      .topbar { padding: var(--space-4) var(--space-6); }
      .empty-state { max-width: 600px; margin: var(--space-6) auto; }
    }
  </style>
</head>
<body>

  <aside class="shell-sidebar" aria-label="Primary navigation">
    <div class="shell-sidebar__game" role="button" tabindex="0">
      <span class="shell-sidebar__game__label">Active Game</span>
      <span class="shell-sidebar__game__current">FireRed</span>
    </div>
    <nav class="shell-sidebar__nav">
      <a class="shell-sidebar__link" href="route-browser.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12l2-2m0 0l7-7 7 7m-9-2v8m-4-4h12" /></svg>
        Routes
      </a>
      <a class="shell-sidebar__link" href="pokemon-browser.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9" /><line x1="3" y1="12" x2="21" y2="12" /></svg>
        Pokémon
      </a>
      <a class="shell-sidebar__link" href="favorites.html" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="12 2 15 9 22 9 17 14 19 21 12 17 5 21 7 14 2 9 9 9" /></svg>
        Favorites
      </a>
      <a class="shell-sidebar__link" href="settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3" /></svg>
        Settings
      </a>
    </nav>
  </aside>

  <header class="topbar">
    <h1 class="topbar__title">Favorites</h1>
    <span class="topbar__count num">2</span>
  </header>

  <main class="grid">
    <a class="pokemon-card" href="pokemon-detail.html">
      <button class="pokemon-card__fav" aria-pressed="true" aria-label="Unfavorite Pikachu" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="12 2 15 9 22 9 17 14 19 21 12 17 5 21 7 14 2 9 9 9" /></svg>
      </button>
      <div class="pokemon-card__sprite"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" alt="" loading="lazy" /></div>
      <span class="pokemon-card__id">No. 0025</span>
      <div class="pokemon-card__name">Pikachu</div>
      <div class="pokemon-card__types"><span class="type-badge type-badge--electric">Electric</span></div>
    </a>

    <a class="pokemon-card" href="pokemon-detail.html">
      <button class="pokemon-card__fav" aria-pressed="true" aria-label="Unfavorite Eevee" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="12 2 15 9 22 9 17 14 19 21 12 17 5 21 7 14 2 9 9 9" /></svg>
      </button>
      <div class="pokemon-card__sprite"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/133.png" alt="" loading="lazy" /></div>
      <span class="pokemon-card__id">No. 0133</span>
      <div class="pokemon-card__name">Eevee</div>
      <div class="pokemon-card__types"><span class="type-badge type-badge--normal">Normal</span></div>
    </a>
  </main>

  <!-- Empty state shown when there are zero favorites — uncomment to preview -->
  <!--
  <div class="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <polygon points="12 2 15 9 22 9 17 14 19 21 12 17 5 21 7 14 2 9 9 9" />
    </svg>
    <h3>No Favorites yet</h3>
    <p>Tap the ★ on any Pokémon card or detail screen to add it here for quick access.</p>
  </div>
  -->

  <nav class="shell-bottom-nav" aria-label="Primary navigation">
    <a class="shell-bottom-nav__item" href="route-browser.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12l2-2m0 0l7-7 7 7m-9-2v8m-4-4h12" /></svg>Routes</a>
    <a class="shell-bottom-nav__item" href="pokemon-browser.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9" /><line x1="3" y1="12" x2="21" y2="12" /></svg>Pokémon</a>
    <a class="shell-bottom-nav__item" href="favorites.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="12 2 15 9 22 9 17 14 19 21 12 17 5 21 7 14 2 9 9 9" /></svg>Favorites</a>
    <a class="shell-bottom-nav__item" href="settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3" /></svg>Settings</a>
  </nav>

  <script>
    document.querySelectorAll('.pokemon-card__fav').forEach(b => b.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
    }));
  </script>
</body>
</html>
